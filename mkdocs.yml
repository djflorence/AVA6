site_name: AVA6 Documentation
site_description: Documentation for the AVA6 AI Assistant
site_author: AVA6 Team

repo_url: https://github.com/djflorence/AVA6
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.annotate

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Installation: user-guide/installation.md
    - Configuration: user-guide/configuration.md
    - Usage: user-guide/usage.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Memory System: developer-guide/memory-system.md
    - Contributing: developer-guide/contributing.md
  - API Reference: api-reference.md
  - Changelog: changelog.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/yourusername

copyright: Copyright &copy; 2023 Your Name 